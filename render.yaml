# Render Blueprint — deploy with: New > Blueprint > point at this repo.
# Free web services: 750 instance-hours/month, no persistent disk, and the
# service spins down after 15 min idle (~1 min cold start). The knowledge
# index is therefore baked into the image at build time (see Dockerfile).
services:
  - type: web
    name: dar-wasalt-chatbot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 7860
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      # Set these in the Render dashboard (Environment > Add Secret), not here:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
